<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Boilerplate Socket Test</title>
    <style>
      body { font-family: ui-monospace, Menlo, Consolas, monospace; padding: 16px; }
      pre { background: #f5f5f5; padding: 12px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h3>Boilerplate running…</h3>
    <button id="refresh">get_state</button>
    <pre id="out"></pre>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const out = document.getElementById('out');
      const log = (x) => out.textContent = x + "\n" + out.textContent;

      const socket = io("http://localhost:8001");
      socket.on("connect", () => log("socket connected"));
      socket.on("state", (data) => log("state: " + JSON.stringify(data)));

      document.getElementById('refresh').onclick = () => {
        socket.emit("get_state");
      };
    </script>
  </body>
</html>
