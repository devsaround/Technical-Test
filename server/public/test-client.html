<!DOCTYPE html>
<html>
<head>
  <title>Order Tracker - Test Client</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 1rem;
    }

    button {
      margin-right: 1rem;
      padding: 10px 20px;
      font-size: 1rem;
    }

    table {
      width: 100%;
      margin-top: 2rem;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background: #eee;
    }

    .progress-bar {
      width: 100px;
      height: 15px;
      background: #ddd;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #4caf50;
    }

    .status {
      text-transform: capitalize;
      font-weight: bold;
    }

    .completed { color: green; }
    .in_progress { color: orange; }
    .new { color: blue; }
    .assigned { color: purple; }
    .canceled { color: red; }
  </style>
</head>
<body>
  <h1>Order Tracker - Test Client</h1>
  <button id="create">Create Order</button>
  <button id="cancel"> Cancel Last Order</button>

  <h2>Drivers</h2>
  <table id="drivers">
    <thead>
      <tr>
        <th>ID</th>
        <th>Location (Lat, Long)</th>
        <th>Radius (mi)</th>
        <th>Status</th>
        <th>Active Order</th>
        <th>Progress</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Orders</h2>
  <table id="orders">
    <thead>
      <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Driver</th>
        <th>Progress</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:8001");

    let lastOrderId = null;

    const driverTable = document.querySelector("#drivers tbody");
    const orderTable = document.querySelector("#orders tbody");

    function renderProgress(percent) {
      return `
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${percent}%"></div>
        </div>
      `;
    }

    function formatTime(ms) {
      const date = new Date(ms);
      return date.toLocaleTimeString();
    }

    function renderState(data) {
      //    Render Drivers 
      driverTable.innerHTML = "";
      data.drivers.forEach(driver => {
        const coords = driver.location || driver.home_location_point?.coordinates || ["-", "-"];
        const radius = driver.radius ?? driver.driving_radius_miles ?? "-";
        driverTable.innerHTML += `
          <tr>
            <td>${driver._id}</td>
            <td>${coords[1]?.toFixed(4) ?? "-"}, ${coords[0]?.toFixed(4) ?? "-"}</td>
            <td>${radius}</td>
            <td>${driver.available ? "Available" : "Busy"}</td>
            <td>${driver.activeOrderId ?? "-"}</td>
            <td>${renderProgress(driver.progress)}</td>
          </tr>
        `;
      });

      //    Render Orders 
      orderTable.innerHTML = "";
      data.orders.forEach(order => {
        orderTable.innerHTML += `
          <tr>
            <td>${order.id}</td>
            <td class="status ${order.status}">${order.status.replace("_", " ")}</td>
            <td>${order.driverId ?? "-"}</td>
            <td>${renderProgress(order.progress)}</td>
            <td>${formatTime(order.createdAt)}</td>
          </tr>
        `;
      });

      if (data.orders.length > 0) {
        lastOrderId = data.orders[data.orders.length - 1].id;
      }
    }

    // Handle incoming state updates
    socket.on("state", renderState);
    socket.on("create", () => socket.emit("get_state"));
    socket.on("cancel", () => socket.emit("get_state"));
    socket.on("tick", () => socket.emit("get_state"));
    socket.on("complete", () => socket.emit("get_state"));

    // Buttons
    document.getElementById("create").onclick = () => {
      socket.emit("create_order");
    };

    document.getElementById("cancel").onclick = () => {
      if (lastOrderId) {
        socket.emit("cancel_order", lastOrderId);
      }
    };

    // Ask for initial snapshot
    socket.emit("get_state");
  </script>
</body>
</html>
